name: Release

# Packagist reads the version from git tags: this workflow tags `v<version>` once CI passes on main,
# and Packagist's GitHub hook picks the tag up (PUBLISHING.md). Nothing is uploaded from here.
on:
  push:
    branches: [main]
    paths:
      - 'src/Version.php'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the version
        id: pkg
        run: echo "version=$(sed -n "s/.*VERSION = '\(.*\)';/\1/p" src/Version.php | head -1)" >> "$GITHUB_OUTPUT"

      - name: Check if the tag already exists
        id: tag_check
        run: |
          if git rev-parse "v${{ steps.pkg.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if already released
        if: steps.tag_check.outputs.exists == 'true'
        run: echo "Tag v${{ steps.pkg.outputs.version }} already exists. Skipping release."

      - uses: shivammathur/setup-php@v2
        if: steps.tag_check.outputs.exists == 'false'
        with:
          php-version: "8.3"
          tools: composer:v2

      - uses: actions/setup-node@v7
        if: steps.tag_check.outputs.exists == 'false'
        with:
          node-version: 22

      - name: Install
        if: steps.tag_check.outputs.exists == 'false'
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Lint, test, guides-check
        if: steps.tag_check.outputs.exists == 'false'
        run: make lint test guides-check

      # A short-lived token from the Yona SDK sync GitHub App, which is installed on einvoice-js only
      # with read access to its contents. Without the app the check below skips with a notice.
      - name: Token that may read einvoice-js
        id: einvoice-js-token
        if: steps.tag_check.outputs.exists == 'false' && vars.EINVOICE_JS_APP_CLIENT_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.EINVOICE_JS_APP_CLIENT_ID }}
          private-key: ${{ secrets.EINVOICE_JS_APP_PRIVATE_KEY }}
          owner: Elyonar
          repositories: einvoice-js
          permission-contents: read

      - name: Snapshot, vectors and generated models match einvoice-js
        if: steps.tag_check.outputs.exists == 'false'
        env:
          EINVOICE_JS_TOKEN: ${{ steps.einvoice-js-token.outputs.token || secrets.EINVOICE_JS_TOKEN }}
        run: |
          if [ -z "$EINVOICE_JS_TOKEN" ]; then
            echo "::notice title=sync-check skipped::einvoice-js is private and no credential may read it here: set the Yona SDK sync app (variable EINVOICE_JS_APP_CLIENT_ID, secret EINVOICE_JS_APP_PRIVATE_KEY), or a fork pull request is running. Run make sync-check locally before a release, with EINVOICE_JS_DIR set to your einvoice-js checkout (any folder name)."
            exit 0
          fi
          make sync-check

      - name: Create git tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.pkg.outputs.version }}" -m "Release v${{ steps.pkg.outputs.version }}"
          git push origin "v${{ steps.pkg.outputs.version }}"

      - name: Extract changelog for this version
        if: steps.tag_check.outputs.exists == 'false'
        id: changelog
        run: |
          VERSION=${{ steps.pkg.outputs.version }}
          awk "/^## ${VERSION}/,/^## [0-9]/" CHANGELOG.md | sed '$d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release v${VERSION}" > release_notes.md
          fi

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          body_path: release_notes.md
          generate_release_notes: true
